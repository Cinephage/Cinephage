---
id: prowlarr
name: Prowlarr
description: Direct integration with the native search API
type: semi-private
language: en-US
encoding: UTF-8
requestdelay: 0.1
# Prowlarr aggregate search queries all indexers; allow up to 90 seconds for a response
requesttimeout: 90000

links:
  - http://localhost:9696/

settings:
  - name: apikey
    type: password
    label: API Key
    required: true
  - name: indexerId
    type: text
    label: Indexer ID
    required: false

# Text-only baseline. Each imported indexer's real ID support is read from
# Prowlarr's per-indexer caps ({baseUrl}/api?t=caps) when the indexer is loaded.
# The aggregate indexer keeps this baseline: Prowlarr drops any tracker that
# can't handle a requested ID, so an aggregate ID search would silently skip
# every text-only tracker.
caps:
  modes:
    search: [q]
    movie-search: [q]
    tv-search: [q]
  categories:
    '2000': Movies
    '2010': Movies/Foreign
    '2020': Movies/Other
    '2030': Movies/SD
    '2040': Movies/HD
    '2045': Movies/UHD
    '2050': Movies/BluRay
    '2060': Movies/3D
    '2070': Movies/DVD
    '2080': Movies/WEB-DL
    '2090': Movies/x265
    '5000': TV
    '5010': TV/WEB-DL
    '5020': TV/Foreign
    '5030': TV/SD
    '5040': TV/HD
    '5045': TV/UHD
    '5050': TV/Other
    '5060': TV/Sport
    '5070': TV/Anime
    '5080': TV/Documentary
    '5090': TV/x265
    '6000': XXX
    '6010': XXX/DVD
    '6020': XXX/WMV
    '6030': XXX/XviD
    '6040': XXX/x264
    '6045': XXX/UHD
    '6050': XXX/Pack
    '6060': XXX/ImgSet
    '6070': XXX/Other
    '6080': XXX/SD
    '6090': XXX/x265
    '8000': Other
    '8010': Other/Misc
    '8020': Other/Hashed

# Prowlarr's search API only accepts query/type/indexerIds/categories/limit/offset.
# IDs, season and episode must be embedded in the query as tokens
# ({ImdbId:tt0111161} {Season:1} {Episode:5}), which Prowlarr parses for the
# movie and tvsearch types only. .Query.IdTokens holds those tokens for an ID
# search (and is empty for a text search), so an ID search sends only the tokens
# and a text search sends only the keywords.
search:
  paths:
    # Movie search
    - path: api/v1/search
      method: get
      categories: [Movies]
      inputs:
        query: '{{ if .Query.IdTokens }}{{ .Query.IdTokens }}{{ else }}{{ .Keywords }}{{ end }}'
        type: movie
        apikey: '{{ .Config.apikey }}'
        $raw: '{{ if .Config.indexerId }}indexerIds={{ .Config.indexerId }}&{{ end }}{{ if .Categories }}categories={{ join .Categories "&categories=" }}{{ end }}'

    # TV search. Text searches stay the basic search they have always been
    # ('tv' is not a Prowlarr search type); the keywords already carry the
    # episode token (S01E05).
    - path: api/v1/search
      method: get
      categories: [TV]
      inputs:
        query: '{{ if .Query.IdTokens }}{{ .Query.IdTokens }}{{ else }}{{ .Keywords }}{{ end }}'
        type: '{{ if .Query.IdTokens }}tvsearch{{ else }}search{{ end }}'
        apikey: '{{ .Config.apikey }}'
        $raw: '{{ if .Config.indexerId }}indexerIds={{ .Config.indexerId }}&{{ end }}{{ if .Categories }}categories={{ join .Categories "&categories=" }}{{ end }}'

    # General keyword search fallback
    - path: api/v1/search
      method: get
      inputs:
        query: '{{ .Keywords }}'
        type: search
        apikey: '{{ .Config.apikey }}'
        $raw: '{{ if .Config.indexerId }}indexerIds={{ .Config.indexerId }}&{{ end }}{{ if .Categories }}categories={{ join .Categories "&categories=" }}{{ end }}'

  response:
    type: json

  fields:
    title:
      selector: title
    details:
      selector: infoUrl
      optional: true
    download:
      selector: downloadUrl
      optional: true
    guid:
      selector: guid
      optional: true
    date:
      selector: publishDate
    size:
      selector: size
      optional: true
    seeders:
      selector: seeders
      optional: true
    leechers:
      selector: leechers
      optional: true
    infohash:
      selector: infoHash
      optional: true
    magnet:
      selector: magnetUrl
      optional: true
    category:
      selector: category
      optional: true
    protocol:
      selector: protocol
      optional: true
