---
# Blutopia (BLU) - Private HD Movies / TV Shows tracker (UNIT3D direct JSON API)
# Source port of Jackett's blutopia-api.yml to Cinephage Cardigann schema.
# UNIT3D API docs: GET /api/torrents/filter (name, seasonNumber, episodeNumber,
# imdbId, tmdbId, tvdbId, categories[], free[], sortField, sortDirection, perPage)
id: blutopia
name: Blutopia (BLU)
description: A private torrent tracker for HD movies / TV Shows (UNIT3D direct API)
type: private
language: en-US
encoding: UTF-8
protocol: torrent
requestdelay: 2

links:
  - https://blutopia.cc/
legacylinks:
  - https://blutopia.xyz/

caps:
  modes:
    search: [q]
    movie-search: [q, imdbid, tmdbid]
    tv-search: [q, season, ep, imdbid, tvdbid, tmdbid]
  categorymappings:
    - { id: 1, cat: Movies, desc: Movie }
    - { id: 2, cat: TV, desc: TV Show }
    - { id: 3, cat: Movies/Other, desc: FANRES }
    - { id: 5, cat: Movies/Other, desc: Trailer }
    - { id: 8, cat: Other, desc: Other }
    - { id: 9, cat: Audio/Video, desc: Live Concert }
    # Parent expansion so Movies/TV searches route to every matching tracker category
    - { id: 1, cat: Movies }
    - { id: 3, cat: Movies }
    - { id: 5, cat: Movies }
    - { id: 2, cat: TV }
    - { id: 9, cat: Audio }

settings:
  - name: apikey
    type: password
    label: API Key
    required: true
  - name: info_key
    type: info
    label: About your API key
    default: 'Find or generate a new API token in Blutopia > My Settings > API Key tab.'
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: created_at
    options:
      created_at: created
      seeders: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc
  - name: info_activity
    type: info
    label: Account Inactivity
    default: 'Log in at least once every 30 days or keep seeding to avoid being disabled.'

login:
  method: get
  path: /api/torrents
  headers:
    Authorization:
      - 'Bearer {{ .Config.apikey }}'
  error:
    - selector: a[href*="/login"]
      message:
        text: 'The API key was not accepted by Blutopia.'

search:
  paths:
    - path: api/torrents/filter
      method: get
      response:
        type: json
      inputs:
        $raw: '{{ range .Categories }}&categories[]={{.}}{{end}}'
        name: '{{ .Keywords }}'
        seasonNumber: '{{ .Query.Season }}'
        episodeNumber: '{{ .Query.Ep }}'
        imdbId: '{{ .Query.IMDBIDShort }}'
        tmdbId: '{{ .Query.TMDBID }}'
        tvdbId: '{{ .Query.TVDBID }}'
        free[]: '{{ if .Config.freeleech }}100{{ else }}{{ end }}'
        sortField: '{{ .Config.sort }}'
        sortDirection: '{{ .Config.type }}'
        perPage: '100'

  headers:
    Authorization:
      - 'Bearer {{ .Config.apikey }}'

  keywordsfilters:
    - name: re_replace
      args: ['\\.', ' ']

  rows:
    selector: data

  fields:
    title:
      selector: attributes.name
    details:
      selector: attributes.details_link
    download:
      selector: attributes.download_link
    infohash:
      selector: attributes.info_hash
      optional: true
    size:
      selector: attributes.size
    seeders:
      selector: attributes.seeders
      optional: true
    leechers:
      selector: attributes.leechers
      optional: true
    grabs:
      selector: attributes.times_completed
      optional: true
    date:
      selector: attributes.created_at
      filters:
        - name: re_replace
          args:
            - \.\d+Z$
            - Z
        - name: dateparse
          args: YYYY-MM-DDTHH:mm:ssZ
    category:
      selector: attributes.category_id
      optional: true
    imdbid:
      selector: attributes.imdb_id
      optional: true
    tmdbid:
      selector: attributes.tmdb_id
      optional: true
    tvdbid:
      selector: attributes.tvdb_id
      optional: true
    poster:
      selector: attributes.meta.poster
      optional: true
      filters:
        - name: replace
          args:
            - 'https://via.placeholder.com/90x135'
            - ''
    downloadvolumefactor:
      selector: attributes.freeleech
      optional: true
      case:
        '0%': '1'
        '0': '1'
        '25%': '0.75'
        '25': '0.75'
        '50%': '0.5'
        '50': '0.5'
        '75%': '0.25'
        '75': '0.25'
        '100%': '0'
        '100': '0'
        '*': '1'
    uploadvolumefactor:
      selector: attributes.double_upload
      optional: true
      case:
        'True': '2'
        'true': '2'
        '*': '1'
    minimumseedtime:
      # BLU global rules: seed 7 days regardless of ratio
      text: '604800'
