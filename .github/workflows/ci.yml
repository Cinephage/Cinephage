# Continuous Integration - Code quality checks
#
# Runs on pushes to dev/main and pull requests targeting dev
# Validates: linting, type checking, tests, and build

name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          npm-version: 12.0.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          npm-version: 12.0.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate paraglide files
        # SvelteKit's build evaluates server module top-level code (route
        # analysis), which reaches getAuthSecret(); a production build has
        # NODE_ENV=production, so the runtime fail-closed check needs a
        # build-only placeholder here. It never reaches a running server.
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-not-used-at-runtime
        run: rm -rf src/lib/paraglide && npm run build

      - name: Run type check
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          npm-version: 12.0.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          npm-version: 12.0.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        # Same build-only placeholder as the typecheck job above: the build
        # environment has no .env, and the secret is only required at runtime.
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-not-used-at-runtime
        run: npm run build

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - run: |
          results='${{ toJson(needs) }}'
          failed=$(echo "$results" | jq '[.[] | select(.result == "failure")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed CI job(s) failed"
            exit 1
          fi
          echo "All CI checks passed"
