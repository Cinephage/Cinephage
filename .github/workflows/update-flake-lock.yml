---
name: Update Nix Flake Lock

on:
  schedule:
    - cron: '0 0 */3 * *' # Every 3 days at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    name: Update Flake Lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: 'chore: update flake.lock'
          base: dev
          pr-labels: |
            dependencies
            nix
            automated
          pr-body: |
            Automated update of Nix flake dependencies.

            This PR was created automatically by the update-flake-lock workflow.
          token: ${{ secrets.GITHUB_TOKEN }}
